services:
  web:
    build: .
    container_name: sidis_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=sidis
      - DB_USER=root
      - DB_PASS=rootpassword
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: sidis_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sidis
    volumes:
      - ./sidis.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - sidis_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sidis_db_data:

